# Konfigurasi pemeriksaan tipe. Jalankan dari root proyek:
#   python -m mypy
#   python -m pyright

[tool.mypy]
python_version = "3.13"
files = ["app.py", "core", "ui", "evaluasi", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["^\\.venv/", "^catatan-laporan/"]

[tool.pyright]
include = ["app.py", "core", "ui", "evaluasi", "tests"]
exclude = [".venv", "**/__pycache__", "catatan-laporan"]
typeCheckingMode = "standard"
